# copied from microsoft/TypeScript and simplified slightly; see that file for boilerplate commentary
# (which was likely copied from github/codeql-action)
name: "Code scanning - action"

on:
  push:
  pull_request:
  schedule:
    - cron: '0 19 * * 0'

jobs:
  CodeQL-Build:
    strategy:
      fail-fast: false
      matrix:
        language: ['python']


    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      with:
        # We must fetch at least the immediate parents so that if this is
        # a pull request then we can checkout the head.
        fetch-depth: 2

    - name: Initialize CodeQL
      uses: github/codeql-action/init@b8d3b6e8af63cde30bdc382c0bc28114f4346c88 # v2.28.1
      with:
        languages: ${{ matrix.language }}
        config-file: ./.github/codeql/codeql-configuration.yml

    - name: Autobuild
      uses: github/codeql-action/autobuild@b8d3b6e8af63cde30bdc382c0bc28114f4346c88 # v2.28.1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@b8d3b6e8af63cde30bdc382c0bc28114f4346c88 # v2.28.1
